services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    networks: [frontnet, backnet]

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL}
    depends_on: [backend]
    ports: ["8501:8501"]
    networks: [frontnet]

networks:
  frontnet:
  backnet:

volumes:
  db_data:
